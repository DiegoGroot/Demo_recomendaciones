# Configuración de análisis para el workspace completo
# Análisis controlado por VS Code - solo para warnings importantes

analyzer:
  exclude:
    - "backend/**"
    - "html/**" 
    - "android/**"
    - "ios/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"
    - "flutter_application/test/**"
    - "flutter_application/.dart_tool/**"
    - "flutter_application/build/**"

  errors:
    # Problemas que ignoro completamente
    missing_required_param: ignore
    invalid_assignment: ignore
    undefined_identifier: ignore
    undefined_method: ignore
    deprecated_member_use: warning
