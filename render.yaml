services:
  - type: web
    name: sira-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    
    # Puerto expuesto
    ports:
      - port: 8000
    
    # Healthcheck
    healthCheckPath: /
    
    # Variables de entorno (REEMPLAZAR CON TUS VALORES)
    envVars:
      - key: DB_HOST
        value: localhost  # Cambiar por tu host MySQL
      - key: DB_USER
        value: sira_user  # Cambiar por tu usuario
      - key: DB_PASSWORD
        sync: false  # No sincronizar en control de versiones
      - key: DB_NAME
        value: sira
      - key: DB_PORT
        value: "3306"
    
    # Comandos de build (opcional si no usas Dockerfile)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    
    # Limites de recursos (free tier)
    plan: starter
    
    # Monitoreo
    maxShutdownDelay: 30

# Alternativa: Usar MySQL en Railway en lugar de hosteado
