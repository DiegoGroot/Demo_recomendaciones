services:
  - type: web
    name: sira-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        value: localhost
      - key: DB_NAME
        value: sira
      - key: PYTHON_VERSION
        value: "3.11"

