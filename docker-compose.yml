version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sira_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sira
      MYSQL_USER: sira_user
      MYSQL_PASSWORD: sira_pass123
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - sira_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  sira_network:
    driver: bridge