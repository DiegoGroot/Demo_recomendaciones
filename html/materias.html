<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias - SIRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard"></i> SIRA
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Editor</span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-nav">
            <li><a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="estudiantes.html"><i class="bi bi-person-fill"></i> Estudiantes</a></li>
            <li><a href="materias.html" class="active"><i class="bi bi-book-fill"></i> Materias</a></li>
            <li><a href="carreras.html"><i class="bi bi-mortarboard-fill"></i> Carreras</a></li>
            <li><a href="calificaciones.html"><i class="bi bi-star-fill"></i> Calificaciones</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2"><i class="bi bi-book-fill"></i> Materias</h1>
                <p class="text-muted">Gestiona el catálogo de materias</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalMateria">
                <i class="bi bi-book-plus"></i> Nueva Materia
            </button>
        </div>

        <!-- Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Créditos</th>
                                <th>Carrera</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="materiasTableBody">
                            <tr>
                                <td>
                                    <i class="bi bi-book me-2" style="color: #ffc107;"></i> Programación I
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark">3</span>
                                </td>
                                <td><span class="badge bg-info">Ingeniería</span></td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editMateria(1, 'Programación I', 3, 1)">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteMateria(1)">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <i class="bi bi-book me-2" style="color: #ffc107;"></i> Cálculo Diferencial
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark">4</span>
                                </td>
                                <td><span class="badge bg-info">Ingeniería</span></td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editMateria(2, 'Cálculo Diferencial', 4, 1)">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteMateria(2)">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <i class="bi bi-book me-2" style="color: #ffc107;"></i> Administración
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark">3</span>
                                </td>
                                <td><span class="badge bg-success">Negocios</span></td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editMateria(3, 'Administración', 3, 2)">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteMateria(3)">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="modalMateria" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nueva Materia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="materiaForm">
                        <input type="hidden" id="materiaId">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="creditos" class="form-label">Créditos</label>
                            <input type="number" class="form-control" id="creditos" min="1" max="6" required>
                        </div>
                        <div class="mb-3">
                            <label for="carrera" class="form-label">Carrera</label>
                            <select class="form-select" id="carrera" required>
                                <option value="">Selecciona una carrera</option>
                                <option value="1">Ingeniería</option>
                                <option value="2">Negocios</option>
                                <option value="3">Medicina</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveMateria()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simulated data
        let materias = [
            { id: 1, nombre: 'Programación I', creditos: 3, carrera: 1 },
            { id: 2, nombre: 'Cálculo Diferencial', creditos: 4, carrera: 1 },
            { id: 3, nombre: 'Administración', creditos: 3, carrera: 2 },
        ];

        let carrerasMap = {
            1: 'Ingeniería',
            2: 'Negocios',
            3: 'Medicina'
        };

        let carreraColors = {
            1: 'info',
            2: 'success',
            3: 'warning'
        };

        let currentMateriaId = null;

        function editMateria(id, nombre, creditos, carrera) {
            currentMateriaId = id;
            document.getElementById('modalTitle').textContent = 'Editar Materia';
            document.getElementById('materiaId').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('creditos').value = creditos;
            document.getElementById('carrera').value = carrera;
            
            const modal = new bootstrap.Modal(document.getElementById('modalMateria'));
            modal.show();
        }

        function saveMateria() {
            const id = document.getElementById('materiaId').value;
            const nombre = document.getElementById('nombre').value;
            const creditos = document.getElementById('creditos').value;
            const carrera = document.getElementById('carrera').value;

            if (!nombre || !creditos || !carrera) {
                alert('Por favor completa todos los campos');
                return;
            }

            if (id) {
                // Update
                const materia = materias.find(m => m.id === parseInt(id));
                if (materia) {
                    materia.nombre = nombre;
                    materia.creditos = parseInt(creditos);
                    materia.carrera = parseInt(carrera);
                }
                alert('Materia actualizada exitosamente');
            } else {
                // Create
                const newId = Math.max(...materias.map(m => m.id), 0) + 1;
                materias.push({
                    id: newId,
                    nombre: nombre,
                    creditos: parseInt(creditos),
                    carrera: parseInt(carrera)
                });
                alert('Materia creada exitosamente');
            }

            bootstrap.Modal.getInstance(document.getElementById('modalMateria')).hide();
            document.getElementById('materiaForm').reset();
            document.getElementById('materiaId').value = '';
            currentMateriaId = null;
            reloadMaterias();
        }

        function deleteMateria(id) {
            if (confirm('¿Estás seguro de eliminar esta materia?')) {
                materias = materias.filter(m => m.id !== id);
                alert('Materia eliminada exitosamente');
                reloadMaterias();
            }
        }

        function reloadMaterias() {
            const tbody = document.getElementById('materiasTableBody');
            tbody.innerHTML = '';
            
            materias.forEach(mat => {
                const color = carreraColors[mat.carrera] || 'primary';
                const carreraName = carrerasMap[mat.carrera] || 'Sin carrera';
                
                const row = `
                    <tr>
                        <td>
                            <i class="bi bi-book me-2" style="color: #ffc107;"></i> ${mat.nombre}
                        </td>
                        <td>
                            <span class="badge bg-warning text-dark">${mat.creditos}</span>
                        </td>
                        <td><span class="badge bg-${color}">${carreraName}</span></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editMateria(${mat.id}, '${mat.nombre}', ${mat.creditos}, ${mat.carrera})">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteMateria(${mat.id})">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        document.getElementById('modalMateria').addEventListener('hidden.bs.modal', function () {
            document.getElementById('modalTitle').textContent = 'Nueva Materia';
            document.getElementById('materiaForm').reset();
            document.getElementById('materiaId').value = '';
            currentMateriaId = null;
        });

        function logout() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                window.location.href = 'login.html';
            }
        }

        // Mark active nav link
        document.addEventListener('DOMContentLoaded', function () {
            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
