<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-mortarboard"></i>
                <h1 class="mt-3">SIRA</h1>
                <p class="text-muted mb-0">Sistema Integrado de Recomendaciones Académicas</p>
            </div>
            <div class="login-body">
                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">
                            Recuérdame
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Inicia Sesión
                    </button>
                </form>

                <!-- Demo credentials -->
                <div class="alert alert-info mb-0">
                    <small>
                        <strong>Credenciales de demo:</strong><br>
                        Email: demo@example.com<br>
                        Contraseña: demo123
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple validation
            if (!email || !password) {
                alert('Por favor completa todos los campos');
                return;
            }

            if (!email.includes('@')) {
                alert('Por favor ingresa un email válido');
                return;
            }

            // Simulated login
            alert('¡Bienvenido! Iniciando sesión...');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
